name: Vendor Brotli dictionary

on:
  push:
    paths:
      - .github/workflows/vendor-dictionary.yml

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Fetch and verify RFC 7932 dictionary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src/decode
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/google/brotli/2ff28fb62deeb8c49720acf2c16ecc8f6f7408f1/c/common/dictionary.bin \
            --output src/decode/dictionary.bin
          test "$(wc -c < src/decode/dictionary.bin)" = "122784"
          test "$(git hash-object src/decode/dictionary.bin)" = "a585c0e292eba19e594ef95f5c4fb38fcb1f7a84"
          test "$(sha256sum src/decode/dictionary.bin | cut -d' ' -f1)" = "20e42eb1b511c21806d4d227d07e5dd06877d8ce7b3a817f378f313653f35c70"
      - name: Commit dictionary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/decode/dictionary.bin
          git commit -m "Vendor RFC 7932 static dictionary"
          git push origin HEAD:main
