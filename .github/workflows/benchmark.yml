name: Benchmark

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/benchmark.yml
      - Cargo.toml
      - benches/corpus.rs
      - benches/decode.rs
      - benches/encode.rs
      - "src/decode/**"
      - "src/encode/**"

env:
  ENCODER_BASELINE_REF: 770e8f80e630227bdfd80053c6246a367b01efd2

permissions:
  contents: read

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Decoder benchmark
        run: cargo bench --bench decode -- --sample-count 20 --sample-size 1

  encode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check out accepted encoder baseline
        uses: actions/checkout@v6
        with:
          ref: ${{ env.ENCODER_BASELINE_REF }}
          path: encoder-baseline
      - name: Check out pinned Google Brotli
        uses: actions/checkout@v6
        with:
          repository: google/brotli
          ref: 2ff28fb62deeb8c49720acf2c16ecc8f6f7408f1
          path: google-brotli
      - name: Link Google corpus into encoder baseline
        run: ln -s ../google-brotli encoder-baseline/google-brotli
      - uses: dtolnay/rust-toolchain@stable
      - name: Build pinned Google Brotli
        run: |
          cmake -S google-brotli -B google-brotli/build \
            -DBUILD_SHARED_LIBS=OFF \
            -DBROTLI_DISABLE_TESTS=ON \
            -DBROTLI_BUILD_TOOLS=OFF \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build google-brotli/build --target brotlienc brotlicommon --parallel
      - name: Build encoder benchmarks
        env:
          RUSTFLAGS: >-
            -L native=${{ github.workspace }}/google-brotli/build
            -l static=brotlienc
            -l static=brotlicommon
            -l m
        run: |
          cargo bench --manifest-path encoder-baseline/Cargo.toml \
            --features current-google-reference --bench encode --bench corpus --no-run
          cargo bench --features current-google-reference \
            --bench encode --bench corpus --no-run
      - name: Inspect q5 matcher assembly
        run: |
          cargo rustc --profile bench --lib -- \
            -C symbol-mangling-version=v0 --emit=asm
          asm="$(find target/release/deps -maxdepth 1 -name 'brutli-*.s' \
            -printf '%T@ %p\n' | sort -nr | head -n1 | cut -d' ' -f2-)"
          echo "assembly: ${asm}"
          python3 - "${asm}" <<'PY'
          import re
          import sys

          path = sys.argv[1]
          lines = open(path, encoding="utf-8").read().splitlines()
          symbol = None
          for line in lines:
              if "find_longest_match" not in line or ".type" not in line:
                  continue
              match = re.search(r"\.type\s+([^,]+),@function", line)
              if match:
                  symbol = match.group(1)
                  break
          if symbol is None:
              print("matcher symbol not found")
              for index, line in enumerate(lines):
                  if "find_longest_match" in line:
                      print(f"{index + 1}: {line}")
              raise SystemExit(0)

          start = next(
              index for index, line in enumerate(lines) if line.strip() == f"{symbol}:"
          )
          end = next(
              (
                  index
                  for index in range(start + 1, len(lines))
                  if lines[index].strip().startswith(f".size\t{symbol}")
              ),
              min(start + 700, len(lines) - 1),
          )
          print(f"matcher symbol: {symbol}")
          print(f"matcher assembly lines: {end - start + 1}")
          print("\n".join(lines[start : end + 1]))
          PY
      - name: Accepted encoder baseline
        env:
          RUSTFLAGS: >-
            -L native=${{ github.workspace }}/google-brotli/build
            -l static=brotlienc
            -l static=brotlicommon
            -l m
        run: |
          cargo bench --manifest-path encoder-baseline/Cargo.toml \
            --features current-google-reference --bench encode -- \
            --sample-count 20 --sample-size 1
      - name: Candidate encoder benchmark
        env:
          RUSTFLAGS: >-
            -L native=${{ github.workspace }}/google-brotli/build
            -l static=brotlienc
            -l static=brotlicommon
            -l m
        run: |
          cargo bench --features current-google-reference --bench encode -- \
            --sample-count 20 --sample-size 1
      - name: Accepted real corpus baseline
        working-directory: encoder-baseline
        env:
          RUSTFLAGS: >-
            -L native=${{ github.workspace }}/google-brotli/build
            -l static=brotlienc
            -l static=brotlicommon
            -l m
        run: |
          cargo bench --features current-google-reference --bench corpus -- \
            --sample-count 10 --sample-size 1
      - name: Candidate real corpus benchmark
        env:
          RUSTFLAGS: >-
            -L native=${{ github.workspace }}/google-brotli/build
            -l static=brotlienc
            -l static=brotlicommon
            -l m
        run: |
          cargo bench --features current-google-reference --bench corpus -- \
            --sample-count 10 --sample-size 1
