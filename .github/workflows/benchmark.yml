name: Benchmark

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/benchmark.yml
      - Cargo.toml
      - benches/corpus.rs
      - benches/decode.rs
      - benches/encode.rs
      - "src/decode/**"
      - "src/encode/**"

env:
  ENCODER_BASELINE_REF: 5d2099a3a1aaa2437451d39d15c6cf1759e80d8f

permissions:
  contents: read

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Decoder benchmark
        run: cargo bench --bench decode -- --sample-count 20 --sample-size 1

  encode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check out accepted encoder baseline
        uses: actions/checkout@v6
        with:
          ref: ${{ env.ENCODER_BASELINE_REF }}
          path: encoder-baseline
      - name: Check out pinned Google Brotli
        uses: actions/checkout@v6
        with:
          repository: google/brotli
          ref: 2ff28fb62deeb8c49720acf2c16ecc8f6f7408f1
          path: google-brotli
      - name: Link Google corpus into encoder baseline
        run: ln -s ../google-brotli encoder-baseline/google-brotli
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply outlined match length candidate
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/encode/match_finder.rs")
          source = path.read_text()
          old = "fn match_length(input: &[u8], previous: usize, current: usize, limit: usize) -> usize {"
          new = "#[inline(never)]\nfn match_length(input: &[u8], previous: usize, current: usize, limit: usize) -> usize {"
          if old not in source:
              raise SystemExit("expected match_length definition not found")
          path.write_text(source.replace(old, new, 1))
          PY
      - name: Build pinned Google Brotli
        run: |
          cmake -S google-brotli -B google-brotli/build \
            -DBUILD_SHARED_LIBS=OFF \
            -DBROTLI_DISABLE_TESTS=ON \
            -DBROTLI_BUILD_TOOLS=OFF \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build google-brotli/build --target brotlienc brotlicommon --parallel
      - name: Build encoder benchmarks
        env:
          RUSTFLAGS: >-
            -L native=${{ github.workspace }}/google-brotli/build
            -l static=brotlienc
            -l static=brotlicommon
            -l m
        run: |
          cargo bench --manifest-path encoder-baseline/Cargo.toml \
            --features current-google-reference --bench encode --bench corpus --no-run
          cargo bench --features current-google-reference \
            --bench encode --bench corpus --no-run
      - name: Accepted encoder baseline
        env:
          RUSTFLAGS: >-
            -L native=${{ github.workspace }}/google-brotli/build
            -l static=brotlienc
            -l static=brotlicommon
            -l m
        run: |
          cargo bench --manifest-path encoder-baseline/Cargo.toml \
            --features current-google-reference --bench encode -- \
            --sample-count 20 --sample-size 1
      - name: Candidate encoder benchmark
        env:
          RUSTFLAGS: >-
            -L native=${{ github.workspace }}/google-brotli/build
            -l static=brotlienc
            -l static=brotlicommon
            -l m
        run: |
          cargo bench --features current-google-reference --bench encode -- \
            --sample-count 20 --sample-size 1
      - name: Accepted real corpus baseline
        working-directory: encoder-baseline
        env:
          RUSTFLAGS: >-
            -L native=${{ github.workspace }}/google-brotli/build
            -l static=brotlienc
            -l static=brotlicommon
            -l m
        run: |
          cargo bench --features current-google-reference --bench corpus -- \
            --sample-count 10 --sample-size 1
      - name: Candidate real corpus benchmark
        env:
          RUSTFLAGS: >-
            -L native=${{ github.workspace }}/google-brotli/build
            -l static=brotlienc
            -l static=brotlicommon
            -l m
        run: |
          cargo bench --features current-google-reference --bench corpus -- \
            --sample-count 10 --sample-size 1
