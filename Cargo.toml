[package]
name = "brutli"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "An idiomatic, high-performance Brotli implementation in Rust"
repository = "https://github.com/nijaru/brutli"
readme = "README.md"
keywords = ["brotli", "compression", "decompression", "codec"]
categories = ["compression", "encoding"]
publish = false

[features]
fuzzing = []

[dependencies]

[dev-dependencies]
brotli = "8.0.4"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
